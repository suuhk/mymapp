<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 지도 디저트 & 카페 투어 서비스</title>
    <!-- Tailwind CSS (UI 디자인 스타일링) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (아이콘 라이브러리) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR 폰트 적용) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 스크롤바 커스텀 스타일링 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 인포윈도우 커스텀 말풍선 스타일 */
        .info-card-shadow {
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* 현재 위치 펄스 애니메이션 마커 */
        .my-location-marker {
            width: 18px;
            height: 18px;
            background-color: #e11d48; /* 로즈 핑크 컬러 */
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.7);
            position: relative;
        }
        .my-location-marker::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: rgba(225, 29, 72, 0.35);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }
            70% {
                transform: scale(1.6);
                opacity: 0;
            }
            100% {
                transform: scale(0.95);
                opacity: 0;
            }
        }
    </style>

    <!-- 카카오 지도 JavaScript API SDK 불러오기 (autoload=false 적용 필수) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=0284f30d15a21cd8c8d334026cc26d3b&libraries=services&autoload=false"></script>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- [왼쪽 영역] 검색창 + 탭 메뉴 + 결과 리스트 -->
    <aside class="w-full md:w-[420px] h-1/2 md:h-full bg-white flex flex-col z-10 shadow-xl border-r border-slate-200">
        
        <!-- 서비스 헤더 -->
        <header class="p-4 bg-gradient-to-r from-pink-500 to-rose-500 text-white flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-2.5">
                <i class="fa-solid fa-cookie-bite text-amber-200 text-2xl animate-bounce"></i>
                <div>
                    <h1 class="text-lg font-bold tracking-tight leading-tight">디저트 투어 지도</h1>
                    <p class="text-[11px] text-pink-100 font-medium">달콤한 디저트 & 분위기 좋은 카페 탐방</p>
                </div>
            </div>
            <span class="text-xs bg-white/20 backdrop-blur-md text-white px-2.5 py-1 rounded-full font-medium border border-white/30">
                Dessert Tour
            </span>
        </header>

        <!-- 탭 버튼 영역 (핵심 기능) -->
        <nav class="flex border-b border-slate-200 bg-slate-50 p-1.5 space-x-1.5">
            <button 
                id="tabBtnBread" 
                onclick="switchTab('bread')"
                class="flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 bg-rose-500 text-white shadow-sm"
            >
                <i class="fa-solid fa-cake-candles"></i>
                <span>🍰 디저트/빵집</span>
            </button>
            <button 
                id="tabBtnCafe" 
                onclick="switchTab('cafe')"
                class="flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 bg-white text-slate-600 hover:bg-slate-100"
            >
                <i class="fa-solid fa-mug-hot text-amber-600"></i>
                <span>☕ 추천 카페</span>
            </button>
        </nav>

        <!-- 직접 검색어 입력 및 추천 태그 -->
        <section class="p-3.5 bg-slate-50 border-b border-slate-200 space-y-2.5">
            <form id="searchForm" onsubmit="handleSearchSubmit(event)" class="relative flex items-center">
                <input 
                    type="text" 
                    id="keywordInput" 
                    placeholder="원하는 장소나 디저트를 검색하세요" 
                    value=""
                    class="w-full pl-9 pr-9 py-2 text-xs bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-rose-400 transition shadow-sm"
                />
                <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-400 text-xs"></i>
                <button 
                    type="button" 
                    onclick="clearSearchInput()" 
                    id="clearBtn"
                    class="hidden absolute right-11 text-slate-400 hover:text-slate-600 p-1"
                >
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
                <button 
                    type="submit" 
                    class="ml-1.5 bg-rose-500 hover:bg-rose-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition duration-150 shadow-sm active:scale-95 shrink-0"
                >
                    검색
                </button>
            </form>

            <!-- 디저트 추천 태그 -->
            <div class="flex items-center space-x-1.5 overflow-x-auto pb-0.5 text-[11px] text-slate-600">
                <span class="text-rose-400 font-medium shrink-0"><i class="fa-solid fa-tags mr-0.5"></i>태그:</span>
                <button onclick="searchByTag('소금빵')" class="bg-white border border-slate-200 px-2 py-0.5 rounded-full hover:bg-rose-50 hover:border-rose-200 hover:text-rose-600 shrink-0 transition">🥐 소금빵</button>
                <button onclick="searchByTag('마카롱')" class="bg-white border border-slate-200 px-2 py-0.5 rounded-full hover:bg-rose-50 hover:border-rose-200 hover:text-rose-600 shrink-0 transition">🍬 마카롱</button>
                <button onclick="searchByTag('케이크')" class="bg-white border border-slate-200 px-2 py-0.5 rounded-full hover:bg-rose-50 hover:border-rose-200 hover:text-rose-600 shrink-0 transition">🎂 케이크</button>
                <button onclick="searchByTag('크로플')" class="bg-white border border-slate-200 px-2 py-0.5 rounded-full hover:bg-rose-50 hover:border-rose-200 hover:text-rose-600 shrink-0 transition">🧇 크로플</button>
            </div>
        </section>

        <!-- 검색 결과 상태 요약 바 -->
        <div class="px-4 py-2 bg-slate-100 border-b border-slate-200 flex justify-between items-center text-xs text-slate-600">
            <span id="currentSearchModeText" class="font-medium text-slate-700">
                모드: <strong class="text-rose-600">🍰 디저트/빵집 검색</strong>
            </span>
            <span class="text-slate-500">결과: <strong id="resultCountText" class="text-rose-600 font-bold">0</strong>건</span>
        </div>

        <!-- 검색 결과 목록 (스크롤 영역) -->
        <section id="placesListContainer" class="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50">
            <div class="flex flex-col items-center justify-center h-full text-slate-400 space-y-2 py-10">
                <i class="fa-solid fa-spinner animate-spin text-2xl text-rose-400"></i>
                <p class="text-xs">주변 장소를 검색하는 중입니다...</p>
            </div>
        </section>

        <!-- 페이지네이션 영역 -->
        <footer id="paginationContainer" class="p-2.5 bg-white border-t border-slate-200 flex justify-center items-center space-x-1">
            <!-- 페이지 번호 버튼들이 동적으로 생성됩니다 -->
        </footer>
    </aside>

    <!-- [오른쪽 영역] Kakao 지도 -->
    <main class="w-full md:flex-1 h-1/2 md:h-full relative bg-slate-200">
        <!-- 카카오 지도 표시 엘리먼트 -->
        <div id="map" class="w-full h-full"></div>

        <!-- 지도 상단 플로팅 컨트롤 버튼 -->
        <div class="absolute top-4 right-4 z-10 flex flex-col space-y-2">
            <!-- 내 위치로 이동 버튼 -->
            <button 
                onclick="moveToCurrentLocation()" 
                title="현재 위치로 이동"
                class="bg-white hover:bg-rose-50 text-slate-700 w-10 h-10 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center transition active:scale-95 group"
            >
                <i class="fa-solid fa-crosshairs text-rose-500 group-hover:rotate-45 transition-transform duration-300"></i>
            </button>

            <!-- 기본 확대 레벨(5) 재설정 버튼 -->
            <button 
                onclick="resetZoomLevel()" 
                title="기본 확대 레벨(Lv5) 설정"
                class="bg-white hover:bg-rose-50 text-slate-700 w-10 h-10 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center transition active:scale-95 text-xs font-bold text-rose-600"
            >
                Lv5
            </button>
        </div>

        <!-- 위치 안내 배지 -->
        <div id="locationStatusBadge" class="absolute bottom-4 left-4 z-10 bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-full shadow-md border border-slate-200 text-xs flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
            <span id="locationBadgeText" class="text-slate-600 font-medium">위치 확인 중...</span>
        </div>
    </main>

    <!-- 토스트 알림 메시지 (alert 대체용) -->
    <div id="toastMessage" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/90 backdrop-blur-md text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center space-x-2">
        <i class="fa-solid fa-bell text-rose-400"></i>
        <span id="toastText">알림 메시지</span>
    </div>

    <script>
        /**
         * 전역 변수 (Global Variables)
         * 고등학생 웹 개발 공부를 돕기 위해 상세한 주석을 달았습니다.
         */
        let mapInstance = null;         // Kakao 지도 객체
        let placesService = null;       // Kakao 장소 검색 서비스 객체
        let currentInfoWindow = null;   // 마커 클릭 시 나타나는 정보창 객체
        let placeMarkers = [];          // 지도 위의 검색 결과 마커 배열
        let userLocationMarker = null;  // 현재 내 위치 표시 마커
        let userLatitude = 37.566826;   // 위도 (기본값: 서울시청)
        let userLongitude = 126.9786567;// 경도 (기본값: 서울시청)
        
        // 현재 선택된 탭 상태 ('bread': 빵집 키워드 검색, 'cafe': CE7 카테고리 검색, 'custom': 직접 검색)
        let activeTabMode = 'bread'; 

        /**
         * STREAMING_CHUNK: Setting up window load event listener...
         * 1. 페이지 로드 완료 시 Kakao Map API 초기화
         */
        window.onload = function() {
            // SDK 다운로드 완료 후 안전하게 지도를 생성하기 위해 kakao.maps.load() 콜백 사용
            kakao.maps.load(function() {
                initKakaoMap();
            });

            // 검색어 입력 시 X 버튼 표시 여부 제어
            const inputEl = document.getElementById('keywordInput');
            const clearBtn = document.getElementById('clearBtn');
            inputEl.addEventListener('input', function() {
                if (this.value.trim().length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
            });
        };

        /**
         * STREAMING_CHUNK: Initializing Kakao Map and places service...
         * 2. 지도 및 검색 서비스 초기화 함수
         */
        function initKakaoMap() {
            const mapContainer = document.getElementById('map');
            
            // 지도 초기 설정
            const mapOptions = {
                center: new kakao.maps.LatLng(userLatitude, userLongitude),
                level: 5 // 지도의 기본 확대 레벨 (요청사항: 5)
            };

            // Kakao 지도 생성
            mapInstance = new kakao.maps.Map(mapContainer, mapOptions);

            // 장소 검색 서비스 객체 생성
            placesService = new kakao.maps.services.Places();

            // 인포윈도우 객체 생성 (팝업 창)
            currentInfoWindow = new kakao.maps.InfoWindow({ zIndex: 2 });

            // 지도 우측 줌 컨트롤러 추가
            const zoomControl = new kakao.maps.ZoomControl();
            mapInstance.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

            // 사용자의 GPS 위치 가져오기
            requestUserLocation();
        }

        /**
         * STREAMING_CHUNK: Requesting browser Geolocation user location...
         * 3. 브라우저 Geolocation API로 내 위치 확인
         */
        function requestUserLocation() {
            const badgeText = document.getElementById('locationBadgeText');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        userLatitude = position.coords.latitude;
                        userLongitude = position.coords.longitude;
                        const currentLatLng = new kakao.maps.LatLng(userLatitude, userLongitude);

                        // 지도의 중심을 내 위치로 이동 및 레벨 5 설정
                        mapInstance.setCenter(currentLatLng);
                        mapInstance.setLevel(5);

                        // 내 위치 마커 표시
                        displayCurrentLocationMarker(currentLatLng);

                        badgeText.textContent = "현재 위치 기반 탐색 중";
                        showToast("현재 위치를 중심으로 주변 장소를 검색합니다.");

                        // 초기 기본 탭(디저트/빵집) 검색 실행
                        executeTabSearch();
                    },
                    function(error) {
                        console.warn('Geolocation 접근 거부/오류:', error.message);
                        badgeText.textContent = "기본 위치 (서울시청)";
                        showToast("위치 권한이 거부되어 기본 위치 기준으로 검색합니다.");
                        executeTabSearch();
                    },
                    { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
                );
            } else {
                badgeText.textContent = "Geolocation 미지원";
                executeTabSearch();
            }
        }

        /**
         * 4. 내 위치 마커 표시 함수
         */
        function displayCurrentLocationMarker(latLng) {
            if (userLocationMarker) {
                userLocationMarker.setMap(null);
            }

            const markerContent = document.createElement('div');
            markerContent.className = 'my-location-marker';
            markerContent.title = '현재 내 위치';

            userLocationMarker = new kakao.maps.CustomOverlay({
                position: latLng,
                content: markerContent,
                yAnchor: 0.5,
                xAnchor: 0.5
            });

            userLocationMarker.setMap(mapInstance);
        }

        /**
         * STREAMING_CHUNK: Handling tab switching and search routing...
         * 5. 탭 전환 및 검색 실행 함수
         * 탭이 바뀔 때 기존 마커와 목록을 깨끗하게 지우고 새 결과를 검색합니다.
         */
        function switchTab(tabType) {
            activeTabMode = tabType;
            
            const tabBread = document.getElementById('tabBtnBread');
            const tabCafe = document.getElementById('tabBtnCafe');
            const modeText = document.getElementById('currentSearchModeText');
            const keywordInput = document.getElementById('keywordInput');

            // 검색창 입력 내용 초기화
            keywordInput.value = '';
            document.getElementById('clearBtn').classList.add('hidden');

            // 탭 스타일 변경 및 모드 업데이트
            if (tabType === 'bread') {
                tabBread.className = 'flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 bg-rose-500 text-white shadow-sm';
                tabCafe.className = 'flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 bg-white text-slate-600 hover:bg-slate-100';
                modeText.innerHTML = '모드: <strong class="text-rose-600">🍰 디저트/빵집 (키워드: 빵집)</strong>';
                showToast("🍰 '디저트/빵집' 검색 결과입니다.");
            } else if (tabType === 'cafe') {
                tabCafe.className = 'flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 bg-amber-500 text-white shadow-sm';
                tabBread.className = 'flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 bg-white text-slate-600 hover:bg-slate-100';
                modeText.innerHTML = '모드: <strong class="text-amber-600">☕ 추천 카페 (카테고리: CE7)</strong>';
                showToast("☕ '추천 카페' 검색 결과입니다.");
            }

            // 탭 변경 시 즉시 검색 실행
            executeTabSearch();
        }

        /**
         * STREAMING_CHUNK: Executing place search with Kakao API...
         * 6. 선택된 탭 조건에 맞게 Kakao 장소 검색 요청
         */
        function executeTabSearch() {
            // 핵심: 검색 전 이전 마커와 목록을 모두 싹 지웁니다!
            clearPreviousMarkers();

            // 지도 중심 좌표 기준으로 주변 장소를 찾기 위한 옵션 설정
            const searchOptions = {
                location: mapInstance.getCenter(),
                radius: 3000 // 지도 중심 반경 3km 범위 검색
            };

            if (activeTabMode === 'bread') {
                // 탭 1 (디저트/빵집): '빵집' 키워드로 장소 검색
                placesService.keywordSearch('빵집', handleSearchCallback, searchOptions);
            } else if (activeTabMode === 'cafe') {
                // 탭 2 (추천 카페): 카테고리 코드 'CE7' (카페)로 장소 검색
                placesService.categorySearch('CE7', handleSearchCallback, searchOptions);
            }
        }

        /**
         * STREAMING_CHUNK: Handling Kakao search API callback...
         * 7. 검색 API 결과 응답 콜백 함수
         */
        function handleSearchCallback(data, status, pagination) {
            const resultCountEl = document.getElementById('resultCountText');

            if (status === kakao.maps.services.Status.OK) {
                resultCountEl.textContent = data.length;

                // 리스트 화면 및 지도 마커 렌더링
                renderPlacesList(data);
                renderPaginationButtons(pagination);

                // 검색된 장소들의 좌표 범위를 계산하여 지도가 모두 포함하도록 설정
                const bounds = new kakao.maps.LatLngBounds();
                for (let i = 0; i < data.length; i++) {
                    bounds.extend(new kakao.maps.LatLng(data[i].y, data[i].x));
                }
                mapInstance.setBounds(bounds);

                // 확대 레벨이 너무 멀어지거나 지나치게 가까워지지 않도록 조정 (Lv5 수준)
                if (mapInstance.getLevel() > 6) {
                    mapInstance.setLevel(5);
                }

            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                resultCountEl.textContent = "0";
                renderEmptyState("주변에 검색된 장소가 없습니다.");
                showToast("주변 검색 결과가 없습니다.");
            } else if (status === kakao.maps.services.Status.ERROR) {
                showToast("장소 검색 요청 중 오류가 발생했습니다.");
            }
        }

        /**
         * STREAMING_CHUNK: Rendering place list items in left sidebar...
         * 8. 검색 결과를 왼쪽 목록에 HTML 카드로 출력
         */
        function renderPlacesList(places) {
            const listContainer = document.getElementById('placesListContainer');
            listContainer.innerHTML = ''; // 기존 목록 초기화

            places.forEach((place, index) => {
                const placeLatLng = new kakao.maps.LatLng(place.y, place.x);

                // 지도에 마커 추가
                const marker = addPlaceMarker(placeLatLng, index, place);
                placeMarkers.push(marker);

                // 리스트 카드 엘리먼트 생성
                const itemEl = document.createElement('div');
                itemEl.className = 'bg-white p-3.5 rounded-xl border border-slate-200 hover:border-rose-400 hover:shadow-md transition duration-150 cursor-pointer flex items-start space-x-3 group';

                const badgeNumber = index + 1;
                
                itemEl.innerHTML = `
                    <div class="flex-shrink-0 w-7 h-7 bg-rose-100 group-hover:bg-rose-500 group-hover:text-white text-rose-600 rounded-lg flex items-center justify-center font-bold text-xs transition-colors">
                        ${badgeNumber}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-slate-800 group-hover:text-rose-600 text-sm truncate transition-colors">
                                ${place.place_name}
                            </h3>
                        </div>
                        <p class="text-xs text-slate-500 mt-1 truncate">
                            <i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${place.road_address_name || place.address_name}
                        </p>
                        ${place.phone ? `
                            <p class="text-xs text-slate-400 mt-0.5">
                                <i class="fa-solid fa-phone text-slate-300 mr-1"></i>${place.phone}
                            </p>
                        ` : ''}
                        <div class="mt-2 flex items-center space-x-2">
                            <span class="text-[10px] bg-rose-50 text-rose-600 border border-rose-100 px-2 py-0.5 rounded-md font-medium">
                                ${place.category_group_name || '디저트/카페'}
                            </span>
                            <a href="${place.place_url}" target="_blank" onclick="event.stopPropagation()" class="text-[11px] text-slate-400 hover:text-rose-600 underline flex items-center">
                                카카오맵 상세보기 <i class="fa-solid fa-arrow-up-right-from-square text-[9px] ml-0.5"></i>
                            </a>
                        </div>
                    </div>
                `;

                // 리스트 항목 클릭 시 해당 장소로 지도 이동 & 팝업 오픈
                itemEl.onclick = function() {
                    mapInstance.panTo(placeLatLng);
                    openInfoWindow(marker, place);
                };

                listContainer.appendChild(itemEl);
            });
        }

        /**
         * STREAMING_CHUNK: Adding place markers on Kakao Map...
         * 9. 지도 상에 마커 추가 및 클릭 이벤트 연결
         */
        function addPlaceMarker(position, index, place) {
            const marker = new kakao.maps.Marker({
                position: position,
                map: mapInstance
            });

            // 마커 클릭 시 장소 이름과 주소를 보여주는 인포윈도우(팝업) 표시
            kakao.maps.event.addListener(marker, 'click', function() {
                mapInstance.panTo(position);
                openInfoWindow(marker, place);
            });

            return marker;
        }

        /**
         * STREAMING_CHUNK: Opening info window popup on marker select...
         * 10. 마커 및 리스트 클릭 시 팝업 카드(인포윈도우) 표시
         */
        function openInfoWindow(marker, place) {
            if (!place) return;

            const addressText = place.road_address_name || place.address_name;

            const contentHtml = `
                <div class="p-3.5 max-w-[230px] rounded-xl">
                    <div class="flex items-center space-x-1.5 text-xs text-rose-500 font-bold mb-1">
                        <i class="fa-solid fa-store"></i>
                        <span>${place.category_group_name || '디저트 카페'}</span>
                    </div>
                    <h4 class="font-bold text-sm text-slate-800 leading-snug">${place.place_name}</h4>
                    <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
                        <i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>${addressText}
                    </p>
                    ${place.phone ? `<p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-phone mr-1"></i>${place.phone}</p>` : ''}
                    <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
                        <a href="${place.place_url}" target="_blank" class="text-xs bg-rose-500 text-white px-3 py-1.5 rounded-lg hover:bg-rose-600 transition font-medium flex items-center shadow-sm">
                            길찾기 / 상세 <i class="fa-solid fa-chevron-right text-[9px] ml-1"></i>
                        </a>
                    </div>
                </div>
            `;

            currentInfoWindow.setContent(contentHtml);
            currentInfoWindow.open(mapInstance, marker);
        }

        /**
         * STREAMING_CHUNK: Clearing existing markers and info windows...
         * 11. 기존 마커 및 팝업창 완전 제거 함수 (탭 변경 시 호출)
         */
        function clearPreviousMarkers() {
            // 기존 마커 지도에서 지우기
            for (let i = 0; i < placeMarkers.length; i++) {
                placeMarkers[i].setMap(null);
            }
            placeMarkers = []; // 배열 초기화

            // 열려있는 인포윈도우가 있다면 닫기
            if (currentInfoWindow) {
                currentInfoWindow.close();
            }
        }

        /**
         * STREAMING_CHUNK: Creating custom search submission and helpers...
         * 12. 검색어가 직접 입력되었을 때의 처리 함수
         */
        function handleSearchSubmit(event) {
            event.preventDefault();
            const keyword = document.getElementById('keywordInput').value.trim();

            if (!keyword) {
                showToast("검색어를 입력해주세요.");
                return;
            }

            activeTabMode = 'custom';
            document.getElementById('currentSearchModeText').innerHTML = `모드: <strong class="text-slate-700">🔍 '${keyword}' 검색</strong>`;
            
            // 탭 스타일 해제
            document.getElementById('tabBtnBread').className = 'flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 bg-white text-slate-600 hover:bg-slate-100';
            document.getElementById('tabBtnCafe').className = 'flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 bg-white text-slate-600 hover:bg-slate-100';

            clearPreviousMarkers();

            const searchOptions = {
                location: mapInstance.getCenter(),
                radius: 3000
            };

            placesService.keywordSearch(keyword, handleSearchCallback, searchOptions);
        }

        // 태그 버튼 클릭 시 검색
        function searchByTag(tagName) {
            const inputEl = document.getElementById('keywordInput');
            inputEl.value = tagName;
            document.getElementById('clearBtn').classList.remove('hidden');
            handleSearchSubmit(new Event('submit'));
        }

        // 검색창 입력 지우기
        function clearSearchInput() {
            const inputEl = document.getElementById('keywordInput');
            inputEl.value = '';
            document.getElementById('clearBtn').classList.add('hidden');
            inputEl.focus();
        }

        // 내 위치로 지도 이동
        function moveToCurrentLocation() {
            if (userLatitude && userLongitude) {
                const currentLatLng = new kakao.maps.LatLng(userLatitude, userLongitude);
                mapInstance.panTo(currentLatLng);
                mapInstance.setLevel(5); // 기본 확대 레벨 5 설정
                showToast("현재 내 위치로 이동했습니다.");
            } else {
                requestUserLocation();
            }
        }

        // 기본 확대 레벨(5)로 재설정
        function resetZoomLevel() {
            if (mapInstance) {
                mapInstance.setLevel(5);
                showToast("지도 확대 레벨을 5로 설정했습니다.");
            }
        }

        // 결과 없음 상태 UI 처리
        function renderEmptyState(message) {
            const listContainer = document.getElementById('placesListContainer');
            listContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-slate-400 space-y-2 py-12">
                    <i class="fa-solid fa-store-slash text-3xl text-slate-300"></i>
                    <p class="text-xs font-medium text-slate-500">${message}</p>
                    <p class="text-[11px] text-slate-400">지도를 다른 위치로 이동한 후 다시 탐색해 보세요.</p>
                </div>
            `;
            document.getElementById('paginationContainer').innerHTML = '';
        }

        // 페이지네이션 버튼 동적 생성
        function renderPaginationButtons(pagination) {
            const paginationContainer = document.getElementById('paginationContainer');
            paginationContainer.innerHTML = '';

            for (let i = 1; i <= pagination.last; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `w-6 h-6 text-[11px] font-bold rounded-lg transition ${
                    i === pagination.current 
                        ? 'bg-rose-500 text-white shadow-sm' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }`;
                pageBtn.innerText = i;
                pageBtn.onclick = (function(page) {
                    return function() {
                        pagination.gotoPage(page);
                    };
                })(i);

                paginationContainer.appendChild(pageBtn);
            }
        }

        // 토스트 알림창 출력 (alert 대용)
        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');
            
            toastText.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
